; Forza Aeromobili Engine - tunables. Reload in game with the console command: aero_flight
; (the engine is switched on/off in Pause > Settings > MODS > Flight engine; that choice is saved under [engine])
[engine]
enabled=0

[flight]
; throttle / speed (m/s)
max_accel=22
max_speed=95
coast_drag=0.25
airbrake=0.8
; lift reaches 1 g at takeoff_speed; flight controls blend in between air_speed and 2*air_speed
; (below air_speed the car handles as stock)
takeoff_speed=38
air_speed=22
lift_factor=1.0
; velocity follows the nose, and the nose is pulled toward the velocity
grip=3.0
alignment_force=1.5
climb_loss=0.5
; stick rates (rad/s) and the damping that stops rotation when sticks are released
pitch_rate=1.2
roll_rate=2.2
yaw_rate=0.6
ang_drag=40
; auto-level strength with centred sticks (roll / pitch)
level_rate=2.0
level_pitch=1.2
; -1 = the game's rotation sense is opposite to the estimate (measured); set 1 to revert
sense=-1
; faked bank turn
bank_yaw=0.6
bank_pitch=0.05
; flip these to -1 if an axis feels reversed
roll_dir=1
pitch_dir=1
yaw_dir=1
